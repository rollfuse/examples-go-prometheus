services:
  mock-rollfuse-api:
    build:
      context: .
      dockerfile: Dockerfile.mock-api
    ports:
      - "8090:8090"

  checkout:
    build:
      context: .
      dockerfile: Dockerfile.checkout
    environment:
      ROLLFUSE_API_BASE_URL: http://mock-rollfuse-api:8090
      ROLLFUSE_SERVICE_CREDENTIAL: demo-credential
    ports:
      - "8080:8080"
    depends_on:
      - mock-rollfuse-api

  loadgen:
    image: curlimages/curl:8.11.0
    depends_on:
      - checkout
    entrypoint:
      - /bin/sh
      - -c
      - |
        sleep 3
        while true; do
          curl -s -o /dev/null "http://checkout:8080/checkout?user=user_$$((RANDOM % 500))"
          sleep 0.2
        done

  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - checkout

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
